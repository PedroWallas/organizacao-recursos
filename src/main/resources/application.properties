spring.application.name=organizacao-recursos

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recursos}
spring.datasource.username=${DB_USUARIO:recursos}
spring.datasource.password=${DB_SENHA:recursos}

# shortcut: o Hibernate cria e atualiza as tabelas. Antes de producao de verdade, trocar por migracoes (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.segredo=${JWT_SEGREDO:segredo-de-desenvolvimento-troque-em-producao}
app.jwt.validade=PT8H

# Administrador criado na primeira subida. Em qualquer ambiente fora da maquina local, defina pelas variaveis.
app.admin.email=${ADMIN_EMAIL:admin@recursos.local}
app.admin.senha=${ADMIN_SENHA:admin123}

# Webhook para avisar mudancas de status. Vazio = notificacao so no log.
app.notificacao.url=${NOTIFICACAO_URL:}

management.endpoints.web.exposure.include=health
